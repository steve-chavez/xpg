name: CI

on:
  push:
    branches:
      - master

  pull_request:
    branches:
      - master

jobs:
  build-test-xpg-core:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Use Cachix Cache
        uses: cachix/cachix-action@v16
        with:
          name: nxpg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build xpg-core
        run: nix-build -A xpg-core

      - name: Install xpg-core
        run: |
          nix profile install .#xpg-core
          echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"

      - name: Build postgres core
        run: |
          cd examples/postgres
          xpg-core build

      - name: Test postgres core
        run: |
          cd examples/postgres
          xpg-core psql -v ON_ERROR_STOP=1 -c "SELECT true;"
          xpg-core -k box test
          xpg-core test

      - name: Upload to cachix
        run: |
          set -euo pipefail
          result=$(nix-build -A xpg-core)
          if [ "${GITHUB_REF}" = 'refs/heads/master' ]; then
            echo "$result" | cachix push nxpg
          fi

  build-test-xpg:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    strategy:
      matrix:
        pg-version: ['12', '13', '14', '15', '16', '17', '18', '19']

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Use Cachix Cache
        uses: cachix/cachix-action@v16
        with:
          name: nxpg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Install GCC
        run: |
          nix develop .

      # TODO: Currently builds are not fully hermetic. We will care about the state of the machine 
      #       until we can invest in making this repo fully hermetic
      - name: Print state
        run: |
          nix develop .
          gcc --version
          ulimit -s
          cat /etc/os-release
          which gcc

      - name: Build postgres extension
        run: |
          nix develop .
          cd examples/hello
          nix run .#xpg${{ matrix.pg-version }} -- build

      - name: Test postgres extension
        run: |
          nix develop .
          cd examples/hello
          nix run .#xpg${{ matrix.pg-version }} -- psql -v ON_ERROR_STOP=1 -c "SELECT true;"
          nix run .#xpg${{ matrix.pg-version }} -- psql -v ON_ERROR_STOP=1 -c "SELECT true;"
          nix run .#xpg${{ matrix.pg-version }} -- test
          nix run .#xpg${{ matrix.pg-version }} -- pgbench -n -c 1 -T 1 -f bench/query.sql

          # test for options argument
          nix run .#xpg${{ matrix.pg-version }} -- --options "-c work_mem=8MB" psql -c "DO \$\$ BEGIN ASSERT current_setting('work_mem') = '8MB'; END \$\$;"

          # test for cassert enabled build
          rm -rf build-${{ matrix.pg-version }}
          nix run .#xpg${{ matrix.pg-version }} -- --cassert psql -c "DO \$\$ BEGIN ASSERT current_setting('debug_assertions') = 'on'; END \$\$;"

          # test for pg core test
          rm -rf ./build-{{ matrix.pg-version }}
          if [ "${{ matrix.pg-version }}" -ge 15 ]; then
            nix run .#xpg${{ matrix.pg-version }} -- test-core
          fi

      - name: Test UBSAN reporting
        run: |
          nix develop .
          cd examples/hello
          rm -rf ./build-{{ matrix.pg-version }}

          # run test with cassert and injected DIV_BY_ZERO error, print all stdout but exit non zero if 
          # expected error code not found
          (HELLO_NULL_PTR_DEREF=1 nix run .#xpg${{ matrix.pg-version }} -- --cassert -v ${{ matrix.pg-version }} test 2>&1 || true) | awk '/runtime error: load of null pointer of type/ { found=1 } { print } END { if (!found) exit 1 }'

      - name: Test ASAN reporting
        run: |
          nix develop .
          cd examples/hello
          # run test with cassert and injected OOB_WRITE error, print all stdout but exit non zero if 
          # expected error code not found
          (HELLO_OOB_WRITE=1 nix run .#xpg${{ matrix.pg-version }} -- --cassert -v ${{ matrix.pg-version }} test 2>&1 || true) | awk '/SUMMARY: AddressSanitizer: heap-buffer-overflow/  { found=1 } { print } END { if (!found) exit 1 }'

      - name: Test TSAN reporting
        if: matrix.pg-version >= 17
        run: |
          nix develop .
          cd examples/hello
          rm -rf ./build-{{ matrix.pg-version }}
          make clean
          (HELLO_THREAD_DATA_RACE=1 nix run .#xpg${{ matrix.pg-version }} -- --tsan -v ${{ matrix.pg-version }} test 2>&1 || true) | awk '/WARNING: ThreadSanitizer: data race/  { found=1 } { print } END { if (!found) exit 1 }'


      - if: ${{ failure() }}
        run: |
          cd examples/hello
          cat regression.out
          cat regression.diffs

      - name: Upload to cachix
        run: |
          set -euo pipefail
          result=$(nix-build -A xpg${{ matrix.pg-version }})
          if [ "${GITHUB_REF}" = 'refs/heads/master' ]; then
            echo "$result" | cachix push nxpg
          fi

  test-nix-expressions:
    runs-on: blacksmith-4vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Use Cachix Cache
        uses: cachix/cachix-action@v16
        with:
          name: nxpg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      # TODO this is failing with the nix profile way
      - name: Test xpgWithExtensions
        run: |
          nix-build tests
          cd examples/hello
          ../../result/bin/xpg psql -v ON_ERROR_STOP=1 -c "CREATE EXTENSION plpgsql_check;"

  build-on-macos:
    runs-on: blacksmith-6vcpu-macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: Use Cachix Cache
        uses: cachix/cachix-action@v16
        with:
          name: nxpg
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build
        run: |
          set -euo pipefail
          result=$(nix-build)
          if [ "${GITHUB_REF}" = 'refs/heads/master' ]; then
            echo "$result" | cachix push nxpg
          fi

  style:
    runs-on: blacksmith-2vcpu-ubuntu-2404

    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Enforce conventional commits
        uses: webiny/action-conventional-commits@7f91b1595ca1951cdb671ddc9f07a49081ec5b69 # v1.4.2

      - name: Install Nix
        uses: cachix/install-nix-action@v30

      - name: lint nix code
        run: |
          set -euo pipefail
          nix fmt -- --ci
